[project]
name = "research-tools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.136.1",
    "fastmcp==3.2.4",
    "pydantic-settings==2.14.0",
]

[tool.uv]
exclude-newer = "14 days"

[dependency-groups]
dev = [
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.1.0",
    "ruff==0.15.12",
]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
extend-select = ["I"]
