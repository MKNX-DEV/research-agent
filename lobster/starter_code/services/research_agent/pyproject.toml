[project]
name = "research-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.136.0",
    "pydantic-ai==1.97.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.0",
    "fastmcp==3.3.1",
    "mcp==1.27.0",
    "shared-libs==0.1.0",
]

[tool.uv]
exclude-newer = "3 days"

[dependency-groups]
dev = [
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.1.0",
    "ruff==0.15.12",
    "pyright==1.1.409",
]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
extend-select = ["I"]

[tool.uv.sources]
shared_libs = { path = "../shared_libs", editable = true }