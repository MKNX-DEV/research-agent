[project]
name = "shared-libs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic==2.13.4",
    "pydantic-settings==2.14.0",
    "uvicorn==0.46.0"
]

[dependency-groups]
dev = [
    "ruff==0.15.12",
    "pyright==1.1.409",
]

[tool.uv]
exclude-newer = "3 days"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
extend-select = ["I"]
